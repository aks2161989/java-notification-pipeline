spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

pipeline:
  mode: DRY_RUN
  use-mock-apis: true
  outbox-dir: target/test-outbox
  lock-file-path: target/test-pipeline.lock
